__include__: [
  '../dataset/plate_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]


output_dir: ./output/rtdetrv2_r18vd_120e_plate

tuning: ../../weights/rtdetrv2_r18vd_120e_coco_rerun_48.1.pth

print_freq: 10          
checkpoint_freq: 5 

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: False


HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5


RTDETRTransformerv2:
  num_layers: 3


epoches: 50      #50

use_amp: True
use_ema: True
ema:
  type: ModelEMA
  decay: 0.9995    
  warmups: 200


lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 100 

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*(?:norm|bn)).*$'
      lr: 0.00001
    -
      params: '^(?=.*backbone)(?=.*(?:norm|bn)).*$'
      lr: 0.00001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0001
  weight_decay: 0.0001
    

train_dataloader:
  total_batch_size: 2
  num_workers: 4        
  dataset:
    transforms:
      ops:             
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Resize, size: [640, 640], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: 47      
  collate_fn:
    scales: ~          

val_dataloader:
  num_workers: 4